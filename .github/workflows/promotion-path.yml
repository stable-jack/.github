name: Promotion path

# Ruleset-required workflows only support pull_request / pull_request_target / merge_group.
# Branch/path filters are ignored when the workflow is required by a ruleset.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce promotion path
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            BASE_REF="${{ github.event.merge_group.base_ref }}"
            BASE_REF="${BASE_REF#refs/heads/}"
            HEAD_REF="${{ github.event.merge_group.head_ref }}"
            HEAD_REF="${HEAD_REF#refs/heads/}"
          fi

          echo "Evaluating promotion path: ${HEAD_REF} -> ${BASE_REF} (event=${EVENT_NAME})"

          case "${BASE_REF}" in
            prod)
              # downtime-notice-prod is the 12 Oct 2026 maintenance banner only.
              if [[ "${HEAD_REF}" != "stage" && "${HEAD_REF}" != "downtime-notice-prod" ]]; then
                echo "::error::prod only accepts PRs from stage (got '${HEAD_REF}')"
                exit 1
              fi
              ;;
            stage)
              if [[ "${HEAD_REF}" != "main" ]]; then
                echo "::error::stage only accepts PRs from main (got '${HEAD_REF}')"
                exit 1
              fi
              ;;
            main)
              # Feature branches and hotfixes may target main.
              ;;
            *)
              echo "::error::Unexpected base branch '${BASE_REF}'"
              exit 1
              ;;
          esac

          echo "OK: ${HEAD_REF} -> ${BASE_REF}"
